name: Build iOS dylib (BBAdBlockPlugin)

on:
  workflow_dispatch:        # 手动触发
  push:
    paths:
      - 'bb-plugin/**'

jobs:
  build:
    runs-on: macos-latest   # 云端 Mac，自带 Xcode + iOS SDK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcrun --sdk iphoneos --show-sdk-path
          xcrun clang --version

      - name: Build dylib
        run: |
          cd bb-plugin
          make
          file BBAdBlockPlugin.dylib
          ls -la BBAdBlockPlugin.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BBAdBlockPlugin.dylib
          path: bb-plugin/BBAdBlockPlugin.dylib
